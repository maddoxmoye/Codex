name: Build fixed Emberwood Mac artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-mac-artifact.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install official Godot editor
        run: bash scripts/install-godot-web.sh
      - name: Install official macOS export template
        run: bash scripts/install-godot-native.sh
      - name: Validate and export universal Mac app
        run: node scripts/build-native-demo.mjs
        env:
          GODOT_BIN: ${{ github.workspace }}/.godot-tools/godot
      - name: Upload fixed Mac app
        uses: actions/upload-artifact@v4
        with:
          name: Wildfall-Emberwood-fixed-macOS
          path: dist/native-demo/Wildfall-Emberwood-macOS.zip
          if-no-files-found: error
          compression-level: 0
