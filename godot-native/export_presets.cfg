[preset.0]
name="macOS"
platform="macOS"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="native_desktop"
export_filter="all_resources"
include_filter="assets/*.json,*.md,licenses/*.txt"
exclude_filter=".templates/*,exports/*,tools/*,preview/*,release-info.json,check_*.gd,check_*.gd.uid"
export_path="../dist/native-demo/Wildfall-Emberwood-macOS.zip"
script_export_mode=2

[preset.0.options]
binary_format/architecture="universal"
custom_template/debug="res://.templates/macos.zip"
custom_template/release="res://.templates/macos.zip"
debug/export_console_wrapper=0
application/icon="res://assets/app-icon.svg"
application/icon_interpolation=4
application/bundle_identifier="com.maddoxmoye.wildfall.emberwood"
application/signature="WFLD"
application/app_category="Games"
application/short_version="0.1.0"
application/version="1"
application/copyright="Wildfall · 2026"
application/min_macos_version_x86_64="11.0"
application/min_macos_version_arm64="11.0"
application/export_angle=0
display/high_res=true
shader_baker/enabled=false
codesign/codesign=1
codesign/entitlements/allow_jit_code_execution=false
codesign/entitlements/allow_unsigned_executable_memory=false
codesign/entitlements/allow_dyld_environment_variables=false
codesign/entitlements/disable_library_validation=false
codesign/entitlements/audio_input=false
codesign/entitlements/camera=false
codesign/entitlements/app_sandbox/enabled=false
notarization/notarization=0

